[package]
name = "effect-scan"
version = "0.0.0"
edition = "2021"
rust-version = "1.97"
publish = false

[[bin]]
name = "effect-scan"
path = "src/main.rs"

[dependencies]
oxc_allocator = "0"
oxc_ast = "0"
oxc_ast_visit = "0"
oxc_parser = "0"
oxc_span = "0"
oxc_str = "0"
oxc_syntax = "0"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
jsonschema = { version = "0", default-features = false }
