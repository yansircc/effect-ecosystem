name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One native binary per platform, built and verified where it runs. Nothing is published: CI only
  # verifies, and a push to main has no write permission.
  build:
    name: Build and verify (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            online: false
          - platform: linux-x64
            runner: ubuntu-24.04
            online: true
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            online: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      - name: Set up Rust (stable; the crate requires rust-version 1.97)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Install dependencies
        run: npm ci

      - name: Build and verify offline gates
        run: make verify-offline

      - name: Check the binary's glibc requirement against platforms.mjs
        if: runner.os == 'Linux'
        run: node scripts/release/check-glibc.mjs "dist/platforms/${{ matrix.platform }}/effect-scan" "${{ matrix.platform }}"

      - name: Verify networked acceptance and performance gates
        if: matrix.online
        run: make verify-online

      - name: Upload platform binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          path: dist/platforms
          if-no-files-found: error
          retention-days: 30

  # Collects the three binaries into the skill and verifies its structure (all platforms required).
  # Artifacts are kept 30 days. Nothing is published.
  skill:
    name: Assemble and verify skill
    needs:
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist/platforms
          merge-multiple: true

      - name: Restore executable bits (artifacts do not keep modes)
        run: chmod +x dist/platforms/*/effect-scan

      - name: Assemble and verify skill
        run: |
          node scripts/release/assemble-skill.mjs --dist dist --require-all-platforms
          node scripts/check-skill-entry.mjs dist/skill --require-all-platforms

      # upload-artifact stores files in a zip and drops modes; a tar keeps runtime/**/effect-scan executable.
      - name: Archive skill (preserves executable bits)
        run: tar -C dist -czf "skill-${GITHUB_SHA}.tar.gz" skill

      - name: Upload skill
        uses: actions/upload-artifact@v7
        with:
          name: skill-${{ github.sha }}
          path: skill-${{ github.sha }}.tar.gz
          if-no-files-found: error
          retention-days: 30
