name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]' && 'release-main' || format('{0}-{1}', github.workflow, github.ref) }}
  cancel-in-progress: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]') }}

jobs:
  # The release identity (version, tag, bump) is computed once. Every other job reproduces it from the
  # same source commit and must agree (see "Require the reproduced release identity").
  identity:
    name: Release identity
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    outputs:
      name: ${{ steps.release.outputs.name }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      mode: ${{ steps.release.outputs.mode }}
      bump: ${{ steps.release.outputs.bump }}
      source_sha: ${{ steps.release.outputs.sourceSha }}
      release_files: ${{ steps.release.outputs.releaseFiles }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      - name: Check out the event source
        run: |
          git fetch origin main --tags
          git checkout --detach "${GITHUB_SHA}"

      - name: Prepare release version
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/release/prepare.mjs "${GITHUB_SHA}"

  # One native binary per platform, built and verified where it runs. The release patch (version
  # bump) is applied before building so every platform embeds the same build id.
  build:
    name: Build and verify (${{ matrix.platform }})
    needs:
      - identity
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-14
            online: false
          - platform: linux-x64
            runner: ubuntu-24.04
            online: true
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            online: false

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      - name: Set up Rust (stable; the crate requires rust-version 1.97)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version

      - name: Check out the event source
        run: |
          git fetch origin main --tags
          git checkout --detach "${GITHUB_SHA}"

      - name: Reproduce release version
        id: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/release/prepare.mjs "${GITHUB_SHA}"

      - name: Require the reproduced release identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          ACTUAL: ${{ steps.release.outputs.version }}|${{ steps.release.outputs.tag }}|${{ steps.release.outputs.bump }}|${{ steps.release.outputs.sourceSha }}|${{ steps.release.outputs.releaseFiles }}
          EXPECTED: ${{ needs.identity.outputs.version }}|${{ needs.identity.outputs.tag }}|${{ needs.identity.outputs.bump }}|${{ needs.identity.outputs.source_sha }}|${{ needs.identity.outputs.release_files }}
        run: test "${ACTUAL}" = "${EXPECTED}"

      - name: Install dependencies
        run: npm ci

      - name: Build and verify offline gates
        env:
          EFFECT_SCAN_RELEASE_SOURCE_SHA: ${{ steps.release.outputs.sourceSha }}
          EFFECT_SCAN_RELEASE_FILES: ${{ steps.release.outputs.releaseFiles }}
        run: make verify-offline

      - name: Verify networked acceptance and performance gates
        if: matrix.online
        run: make verify-online

      - name: Upload platform binary
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.platform }}
          path: dist/platforms
          if-no-files-found: error
          retention-days: 1

  # Collects the three binaries into the npm release set and the skill, verifies them, and dry-runs
  # the publish. Nothing here publishes.
  package:
    name: Package release set
    needs:
      - identity
      - build
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      - name: Check out the event source
        run: |
          git fetch origin main --tags
          git checkout --detach "${GITHUB_SHA}"

      - name: Reproduce release version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/release/prepare.mjs "${GITHUB_SHA}"

      - name: Install dependencies
        run: npm ci

      - name: Download platform binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist/platforms
          merge-multiple: true

      - name: Restore executable bits (artifacts do not keep modes)
        run: chmod +x dist/platforms/*/effect-scan

      - name: Pack npm release set (all platforms required)
        run: node scripts/release/pack.mjs --dist dist --out dist/npm

      - name: Verify npm release set
        run: node scripts/verify-package.mjs --packages dist/npm

      - name: Verify release build provenance
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          node scripts/release/verify-release-build-info.mjs \
            dist/npm/yansircc-effect-scan-[0-9]*.tgz \
            "${{ needs.identity.outputs.source_sha }}" \
            "${{ needs.identity.outputs.release_files }}"

      - name: Assemble and verify skill
        run: |
          node scripts/release/assemble-skill.mjs --dist dist --require-all-platforms
          node scripts/check-skill-entry.mjs dist/skill --require-all-platforms

      - name: Dry-run publish
        run: node scripts/release/publish.mjs dist/npm --dry-run

      - name: Upload verified npm release set
        uses: actions/upload-artifact@v7
        with:
          name: npm-packages-${{ github.sha }}
          path: dist/npm/*.tgz
          if-no-files-found: error
          retention-days: 1

      - name: Upload skill
        uses: actions/upload-artifact@v7
        with:
          name: skill-${{ github.sha }}
          path: dist/skill
          if-no-files-found: error
          retention-days: 7

  commit_release:
    name: Commit and tag release
    needs:
      - identity
      - package

    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      - name: Reproduce release version
        id: release
        env:
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
        run: |
          git fetch origin main --tags
          git checkout --detach "${SOURCE_SHA}"
          node scripts/release/prepare.mjs "${SOURCE_SHA}"

      - name: Require the reproduced release identity
        shell: bash
        env:
          ACTUAL_NAME: ${{ steps.release.outputs.name }}
          ACTUAL_VERSION: ${{ steps.release.outputs.version }}
          ACTUAL_TAG: ${{ steps.release.outputs.tag }}
          ACTUAL_MODE: ${{ steps.release.outputs.mode }}
          ACTUAL_BUMP: ${{ steps.release.outputs.bump }}
          ACTUAL_SOURCE_SHA: ${{ steps.release.outputs.sourceSha }}
          ACTUAL_RELEASE_FILES: ${{ steps.release.outputs.releaseFiles }}
          EXPECTED_NAME: ${{ needs.identity.outputs.name }}
          EXPECTED_VERSION: ${{ needs.identity.outputs.version }}
          EXPECTED_TAG: ${{ needs.identity.outputs.tag }}
          EXPECTED_MODE: ${{ needs.identity.outputs.mode }}
          EXPECTED_BUMP: ${{ needs.identity.outputs.bump }}
          EXPECTED_SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          EXPECTED_RELEASE_FILES: ${{ needs.identity.outputs.release_files }}
        run: |
          test "${ACTUAL_NAME}" = "${EXPECTED_NAME}"
          test "${ACTUAL_VERSION}" = "${EXPECTED_VERSION}"
          test "${ACTUAL_TAG}" = "${EXPECTED_TAG}"
          test "${ACTUAL_MODE}" = "${EXPECTED_MODE}"
          test "${ACTUAL_BUMP}" = "${EXPECTED_BUMP}"
          test "${ACTUAL_SOURCE_SHA}" = "${EXPECTED_SOURCE_SHA}"
          test "${ACTUAL_RELEASE_FILES}" = "${EXPECTED_RELEASE_FILES}"

      - name: Commit and tag release
        if: steps.release.outputs.mode == 'new'
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          BUMP: ${{ steps.release.outputs.bump }}
          SOURCE_SHA: ${{ steps.release.outputs.sourceSha }}
          RELEASE_FILES: ${{ steps.release.outputs.releaseFiles }}
        run: |
          IFS=, read -r -a release_files <<< "${RELEASE_FILES}"
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' "${release_files[@]}" | sort)"
          if [[ "${actual}" != "${expected}" ]]; then
            echo "Release preparation changed unexpected files." >&2
            diff -u <(printf '%s\n' "${expected}") <(printf '%s\n' "${actual}") || true
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "${release_files[@]}"
          git commit \
            -m "chore(release): v${VERSION}" \
            -m "Release-Source: ${SOURCE_SHA}" \
            -m "Release-Bump: ${BUMP}"
          git tag -a "${TAG}" -m "${TAG}"
          git push --atomic origin HEAD:main "refs/tags/${TAG}"

  publish:
    name: Publish npm packages
    needs:
      - identity
      - package
      - commit_release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      - name: Download verified npm release set
        uses: actions/download-artifact@v8
        with:
          name: npm-packages-${{ github.sha }}
          path: release

      - name: Publish verified packages (platform packages first, shim last; idempotent)
        run: node scripts/release/publish.mjs release

  verify-public:
    name: Verify public projection
    needs:
      - identity
      - publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.11.0

      - name: Download verified npm release set
        uses: actions/download-artifact@v8
        with:
          name: npm-packages-${{ github.sha }}
          path: release

      - name: Verify registry integrity and public installation
        run: node scripts/release/verify-public.mjs release
